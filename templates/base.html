<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0A0C">
<meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false}'>
<title>{% block title %}AgentFlow{% endblock %} · AgentFlow</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css?v={{ nav.version }}">
<script src="/static/htmx.min.js?v={{ nav.version }}" defer></script>
<script src="/static/app.js?v={{ nav.version }}" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="top-in">
    <a class="brand" href="/"><img src="/static/logo.svg?v={{ nav.version }}" width="28" height="28" alt=""><span>AgentFlow</span></a>
    <nav class="nav" aria-label="Main">
      {% for item in nav.items %}
      <a href="{{ item.href }}"{% if item.active %} class="on" aria-current="page"{% endif %}>{{ item.name }}{% if item.href == "/" && nav.waiting > 0 %} <span class="mono count">{{ nav.waiting }}</span>{% endif %}</a>
      {% endfor %}
    </nav>
    <div class="grow"></div>
    <span class="who">{{ nav.label }}</span>
    <a class="icon-btn" href="/settings" aria-label="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></a>
  </div>
</header>
<main id="main" class="page">
{% block content %}{% endblock %}
</main>
<footer class="foot"><span class="mono">AgentFlow {{ nav.version }}</span><form method="post" action="/logout"><button class="link-btn" type="submit">Sign out</button></form></footer>
</body>
</html>
