{% extends "base.html" %}
{% block title %}More{% endblock %}
{% block content %}
<div class="head"><h1>More</h1></div>
<ul class="card more-list plain">
  {% for i in items %}<li><a href="{{ i.href }}">{{ i.icon|safe }}<span>{{ i.name }}</span><span class="chev">{{ crate::web::icons::icon("chevron")|safe }}</span></a></li>{% endfor %}
</ul>
{% endblock %}
