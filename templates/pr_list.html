<ol class="prs">
{% for pr in prs %}
  <li class="pr-row">
    <div class="row wrap"><span class="mono sub">{{ pr.position }}</span><a class="mono" href="{{ pr.url }}">#{{ pr.number }}</a><a class="pr-title" href="{{ pr.record_url }}">{{ pr.title }}</a><span class="chip {{ pr.chip_class }}">{{ pr.chip }}</span></div>
    <div class="pr-actions">
      {% for b in pr.buttons %}{% include "button.html" %}{% endfor %}
      {% if let Some((label, ids, confirm)) = pr.up_to %}
      <form method="post" action="/p/{{ slug }}/merge-up-to/{{ pr.number }}"><input type="hidden" name="actions" value="{{ ids }}"><button class="btn sm ghost" type="submit" data-confirm="{{ confirm }}">{{ label }}</button></form>
      {% endif %}
      <a class="sub" href="{{ pr.url }}/files">View changes on GitHub</a>
    </div>
  </li>
{% endfor %}
</ol>
