[package]
name = "agentflow"
version = "0.0.0-dev"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-or-later"
description = "Project management for Claude agents and their owner: records, questions, PRs, builds and a log"
repository = "https://github.com/giosuel/agent-flow"
publish = false

[dependencies]
aes-gcm = "0.11"
anyhow = "1"
askama = "0.16"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env"] }
futures = "0.3"
hkdf = "0.13"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
p256 = { version = "0.14", features = ["ecdh", "ecdsa"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "blocking", "form"] }
rmcp = { version = "=3.9.0", features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.41", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "process", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webauthn-rs = { version = "0.6", features = ["danger-allow-state-serialisation"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
# Faster debug builds on a shared machine: no debug info for dependencies.
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = true
